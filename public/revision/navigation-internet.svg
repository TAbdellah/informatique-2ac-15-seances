<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Du navigateur à Internet</title>
  <desc id="desc">Une adresse Web est saisie dans le navigateur, une demande part vers Internet, le serveur répond et la page s'affiche.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbfc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2944"/>
      <stop offset="1" stop-color="#154f70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2944" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#12a6ae"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="800" fill="#102b43">Que se passe-t-il quand j’ouvre un site Web ?</text>

  <g filter="url(#shadow)">
    <rect x="55" y="102" width="400" height="300" rx="22" fill="#fff" stroke="#cbdde3"/>
    <path d="M77 102h356a22 22 0 0 1 22 22v39H55v-39a22 22 0 0 1 22-22Z" fill="url(#navy)"/>
    <circle cx="84" cy="133" r="7" fill="#ff7f73"/>
    <circle cx="108" cy="133" r="7" fill="#ffd05a"/>
    <circle cx="132" cy="133" r="7" fill="#5cd5a7"/>
    <rect x="87" y="188" width="336" height="54" rx="14" fill="#f3f7f8" stroke="#88aeb9" stroke-width="2"/>
    <circle cx="116" cy="215" r="10" fill="none" stroke="#17a5ad" stroke-width="3"/>
    <path d="m123 222 8 8" stroke="#17a5ad" stroke-width="3" stroke-linecap="round"/>
    <text x="147" y="223" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#173650">www.youtube.com</text>
    <rect x="345" y="255" width="78" height="38" rx="10" fill="#ffca3a"/>
    <text x="384" y="280" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="14" font-weight="900" fill="#102b43">ENTRÉE</text>
    <rect x="87" y="312" width="115" height="56" rx="12" fill="#e8f7f8"/>
    <rect x="218" y="312" width="76" height="56" rx="12" fill="#edf2f5"/>
    <rect x="310" y="312" width="113" height="56" rx="12" fill="#edf2f5"/>
    <text x="255" y="442" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#526b7d">NAVIGATEUR</text>
  </g>

  <g>
    <path d="M470 225c55-76 135-77 186-14 58-36 129 2 129 69 0 62-50 101-111 101H529c-62 0-107-40-107-96 0-30 16-52 48-60Z" fill="#fff" stroke="#9fc8d0" stroke-width="3" filter="url(#shadow)"/>
    <path d="M515 279c43-41 121-41 169 0" fill="none" stroke="#16a3ac" stroke-width="10" stroke-linecap="round"/>
    <path d="M548 314c25-23 77-23 103 0" fill="none" stroke="#16a3ac" stroke-width="10" stroke-linecap="round"/>
    <circle cx="600" cy="345" r="9" fill="#16a3ac"/>
    <text x="600" y="199" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="23" font-weight="900" fill="#102b43">INTERNET</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="855" y="113" width="290" height="278" rx="23" fill="#fff" stroke="#cbdde3"/>
    <rect x="915" y="163" width="170" height="54" rx="12" fill="#173650"/>
    <circle cx="1052" cy="190" r="7" fill="#55d6a5"/>
    <rect x="915" y="232" width="170" height="54" rx="12" fill="#173650"/>
    <circle cx="1052" cy="259" r="7" fill="#55d6a5"/>
    <rect x="915" y="301" width="170" height="54" rx="12" fill="#173650"/>
    <circle cx="1052" cy="328" r="7" fill="#55d6a5"/>
    <text x="1000" y="432" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#526b7d">SERVEUR DU SITE</text>
  </g>

  <path d="M460 189C595 115 740 115 848 190" fill="none" stroke="#12a6ae" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="602" y="100" width="124" height="34" rx="17" fill="#dff6f7"/>
  <text x="664" y="123" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#08737c">DEMANDE</text>

  <path d="M848 395C735 475 583 475 460 395" fill="none" stroke="#f2ad19" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="602" y="443" width="124" height="34" rx="17" fill="#fff0c6"/>
  <text x="664" y="466" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#835d00">RÉPONSE</text>
</svg>
