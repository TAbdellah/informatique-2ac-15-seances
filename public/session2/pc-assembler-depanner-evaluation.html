<!DOCTYPE html>
<html lang="fr" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le PC : assembler et dépanner</title>
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12302d;--mut:#51706b;--pcb:#0e5a52;--sol:#f2c230;--ok:#17874f;--ko:#c93d36;--line:#cfdcd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a19;--card:#162a28;--ink:#e6f1ee;--mut:#9bb7b1;--pcb:#2aa392;--ok:#4cc88a;--ko:#ff7b73;--line:#2b4642}}
:root[data-theme="dark"]{--bg:#0d1a19;--card:#162a28;--ink:#e6f1ee;--mut:#9bb7b1;--pcb:#2aa392;--ok:#4cc88a;--ko:#ff7b73;--line:#2b4642}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.w{max-width:940px;margin:0 auto;padding:16px}
h1{font-size:25px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tabs button{border:2px solid var(--pcb);background:transparent;padding:8px 16px;border-radius:10px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--pcb);color:#fff}
button:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.hint{color:var(--mut);margin:0 0 10px}
.g{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:720px){.g{grid-template-columns:1fr}}
.case{background:var(--card);border:3px solid var(--pcb);border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{min-height:66px;border:2px dashed var(--line);border-radius:10px;padding:8px;font-size:14px;color:var(--mut);display:flex;flex-direction:column;justify-content:center;text-align:center}
.slot.on{border:2px solid var(--ok);border-style:solid;color:var(--ink);font-weight:700;background:rgba(23,135,79,.12)}
.slot.sel{border-color:var(--sol)}
.slot.bad{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.slot.bad,.zone.bad{animation:none;border-color:var(--ko)}}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.piece{touch-action:none;user-select:none;border:2px solid var(--pcb);background:var(--card);border-radius:10px;padding:5px 9px;font-weight:700;font-size:14px;cursor:grab}
.piece.sel{background:var(--sol);color:#12302d;border-color:var(--sol)}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
.board{display:grid;grid-template-columns:1fr 1.7fr 1fr;grid-template-areas:"top top top" "left case right" "bot bot bot";gap:10px;margin-top:10px}
@media(max-width:720px){.board{grid-template-columns:1fr;grid-template-areas:"case" "left" "right" "top" "bot"}}
.zone{border:2px dashed var(--mut);border-radius:12px;padding:8px 10px;min-height:76px;align-content:flex-start}
.zone>b{display:block;color:var(--pcb);margin-bottom:4px}
.zone.sel{border-color:var(--sol)}
.zone.bad{animation:sh .35s}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 8px;border-radius:8px;background:rgba(23,135,79,.15);border:1px solid var(--ok);font-size:14px}
.piece{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:94px}
.piece img,.chip img{border-radius:5px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:4px}
.opts button{display:flex;align-items:center;gap:8px}
.opts button img{border-radius:5px}
.slot img{border-radius:5px;margin:0 auto}
.ctitle{text-align:center;font-weight:700;margin-bottom:4px}
.msg{min-height:1.5em;margin:10px 0 0;font-weight:700}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sol);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}
.opts button{border:2px solid var(--pcb);background:var(--card);border-radius:10px;padding:10px;font-weight:700;text-align:left}
.opts button:disabled{opacity:.55;cursor:default}
.opts button.g1{border-color:var(--ok);background:rgba(23,135,79,.15);opacity:1}
.opts button.r1{border-color:var(--ko);opacity:1}
.nx{border:0;background:var(--pcb);color:#fff;padding:9px 18px;border-radius:10px;font-weight:700;margin-top:8px}
#tip{position:fixed;z-index:30;display:none;pointer-events:none;background:#12302d;color:#fff;padding:6px 14px;border-radius:8px;font:700 18px/1.3 Tahoma,"Segoe UI",system-ui,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.35);white-space:normal;width:max-content;max-width:min(360px,90vw);text-align:center;transform:translate(-50%,-100%)}</style></head><body><div class="w">
<h1>Le PC : assembler et dépanner</h1>
<div class="tabs"><button id="t1" aria-pressed="true">1. Assembler le PC</button><button id="t2" aria-pressed="false">2. Dépanner le PC</button></div>
<section id="a">
<p class="hint">Autour de l’unité centrale, classe chaque appareil : fais glisser les pièces vers les composants internes (selon leur rôle) ou vers la bonne catégorie de périphériques. Tu peux aussi toucher une pièce, puis l’endroit.</p>
<div class="tray" id="tray"></div>
<p class="msg" id="msg"></p>
<div class="board">
<div class="zone" data-zone="io" style="grid-area:top"></div>
<div class="zone" data-zone="in" style="grid-area:left"></div>
<div style="grid-area:case"><div class="ctitle">Unité centrale</div><div class="case" id="case"></div></div>
<div class="zone" data-zone="out" style="grid-area:right"></div>
<div class="zone" data-zone="st" style="grid-area:bot"></div>
</div></section>
<section id="d" hidden></section>
</div>

var ZN={in:'Périphériques d’entrée',out:'Périphériques de sortie',io:'Périphériques d’entrée/sortie',st:'Périphériques de stockage'};
var $=function(i){return document.getElementById(i)};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var ALL=K.map(function(k){return {k:k[0],n:k[1],e:k[3]}}).concat(PE.map(function(p){return {k:p[0],n:p[1],e:p[2],z:p[3]}}));
function it(k){return ALL.filter(function(p){return p.k==k})[0]}
function nm(k){var p=it(k);return [p.k,p.n,'',p.e]}
var order,done,err,selp;
function reset(){order=shuf(ALL.map(function(p){return p.k}));done={};err=0;selp=null;$('msg').textContent='';$('msg').className='msg';draw()}
function draw(){
 if(typeof hideTip=='function')hideTip();
 $('case').innerHTML=K.map(function(k){var p=done[k[0]];return '<div class="slot'+(p?' on':'')+'" data-slot="'+k[0]+'">'+(p?'✓ '+pic(k[0],34,k[3])+'<br>'+k[1]:k[2])+'</div>'}).join('');
 document.querySelectorAll('.zone').forEach(function(z){var id=z.dataset.zone;z.innerHTML='<b>'+ZN[id]+'</b>'+PE.filter(function(p){return done[p[0]]&&p[3]==id}).map(function(p){return '<span class="chip" data-k="'+p[0]+'">'+pic(p[0],22,p[2])+' '+p[1]+'</span>'}).join('')});
 $('tray').innerHTML=order.filter(function(k){return !done[k]}).map(function(k){var p=it(k);return '<div class="piece'+(selp==k?' sel':'')+'" data-p="'+k+'">'+pic(k,38,p.e)+'<span>'+p.n+'</span></div>'}).join('')||'Toutes les pièces sont placées.'}
function say(t,c){$('msg').textContent=t;$('msg').className='msg '+c}
function drop(k,el){
 var s=el&&el.closest('[data-slot]'),z=el&&el.closest('[data-zone]'),t=s||z;if(!t){selp=null;draw();return}
