name: Importer le projet complet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "import-site*.tar.gz"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'import-site*.tar.gz' -size +1024c -print -quit)"
          if [ -z "$archive" ]; then
            echo "Aucune archive valide trouvee."
            exit 1
          fi
          tar --exclude='./.github/workflows' --exclude='./.github/workflows/*' -xzf "$archive"
          rm -f import-site*.tar.gz

      - name: Publier les fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier les mises a jour du site informatique 2AC"
          git push
