name: Importer le projet complet

on:
  push:
    branches: [main]
    paths: [import-site.tar.gz]

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Extraire le projet
        run: |
          tar -xzf import-site.tar.gz
          rm -f import-site.tar.gz .github/workflows/import-project.yml
      - name: Publier les fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier le site informatique 2AC - 15 seances"
          git push
