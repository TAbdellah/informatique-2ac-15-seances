  <text x="137" y="67" class="latin medium" font-size="27" fill="#FFFFFF">LAB·2AC</text>
  <text x="138" y="91" class="latin regular" font-size="14" letter-spacing="4" fill="#8EA8C1">INFORMATIQUE</text>

