<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1125" viewBox="0 0 1600 1125" role="img" aria-labelledby="title desc">
  <title id="title">LAB·2AC — Vue d’ensemble du projet pédagogique</title>
  <desc id="desc">Schéma bilingue du parcours élève, de l’espace enseignant et de l’architecture technique de la plateforme LAB·2AC.</desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2036"/>
      <stop offset="1" stop-color="#103451"/>
    </linearGradient>
    <linearGradient id="paperGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8F5"/>
      <stop offset="1" stop-color="#EEF7F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17324B" flood-opacity="0.10"/>
    </filter>
    <style>
      .latin { font-family: "Segoe UI", Arial, sans-serif; }
      .arabic { font-family: Tahoma, Arial, sans-serif; direction: rtl; unicode-bidi: bidi-override; text-anchor: end; }
      .regular { font-weight: 400; }
      .medium { font-weight: 600; }
      .muted { fill: #63758A; }
      .ink { fill: #14253A; }
      .cyan { fill: #169EAF; }
      .green { fill: #258C5C; }
      .red { fill: #D34A47; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .card-title { font-size: 24px; font-weight: 600; fill: #14253A; }
      .card-ar { font-size: 19px; fill: #169EAF; }
      .body { font-size: 17px; fill: #63758A; }
    </style>
  </defs>

  <rect width="1600" height="1125" rx="34" fill="url(#paperGradient)"/>

