  <text x="58" y="191" class="latin medium" font-size="42" fill="#FFFFFF">Un parcours interactif, de la mission à l’évaluation</text>
  <text x="590" y="226" class="arabic regular" font-size="25" fill="#C7D7E6">مسار تفاعلي موجّه من المهمة إلى التقويم</text>

